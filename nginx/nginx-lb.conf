# ==============================================================
# nginx-lb.conf — Load Balancer Principal (Docker Swarm)
# ==============================================================
# No Swarm, o DNS interno resolve "backend" e "frontend"
# para os IPs de todas as réplicas automaticamente.
# O Nginx usa o resolver do Swarm (127.0.0.11) para descoberta
# dinâmica dos serviços e distribui o tráfego.
# ==============================================================

worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
    multi_accept on;
}

http {
    # ── Resolver DNS interno do Docker Swarm ─────────────────
    resolver 127.0.0.11 valid=10s ipv6=off;

    # ── Upstream: Backend (Spring Boot) ──────────────────────
    upstream backend_api {
        least_conn;
        server backend:8080;
        keepalive 32;
    }

    # ── Upstream: Frontend (Flutter Web) ─────────────────────
    upstream frontend_app {
        least_conn;
        server frontend:80;
        keepalive 16;
    }

    # ── Logging ───────────────────────────────────────────────
    log_format main '$remote_addr - [$time_local] '
                    '"$request" $status $body_bytes_sent '
                    'rt=$request_time us="$upstream_addr" ust="$upstream_response_time"';
    access_log /var/log/nginx/access.log main;

    # ── Performance ───────────────────────────────────────────
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;

    gzip on;
    gzip_vary on;
    gzip_min_length 256;
    gzip_types application/json application/javascript text/css text/plain;

    client_max_body_size 20m;
    server_tokens off;

    # ── Servidor: Frontend (porta 80) ────────────────────────
    server {
        listen 80;
        server_name _;

        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;

        location / {
            proxy_pass http://frontend_app;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_http_version 1.1;
            proxy_connect_timeout 10s;
            proxy_read_timeout 60s;
        }

        location /nginx-health {
            access_log off;
            return 200 'OK';
            add_header Content-Type text/plain;
        }
    }

    # ── Servidor: Backend API (porta 8080) ───────────────────
    server {
        listen 8080;
        server_name _;

        add_header X-Content-Type-Options "nosniff" always;

        location / {
            proxy_pass http://backend_api;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Connection "";
            proxy_http_version 1.1;
            proxy_connect_timeout 10s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
            proxy_buffering on;
            proxy_buffer_size 8k;
            proxy_buffers 8 16k;
            proxy_next_upstream error timeout http_502 http_503 http_504;
        }
    }
}
