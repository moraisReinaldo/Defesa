# ==============================================================
# docker-compose.yml - Defesa em Foco / Stack Principal
# ==============================================================
# Compativel com docker-compose up E docker stack deploy (Swarm).
#
# Uso local (Mac mini / producao):
#   docker-compose up -d --build
#
# Deploy no Swarm (seminario):
#   docker stack deploy -c docker-compose.yml defesacivil
#
# Visualizer (apenas seminario):
#   docker-compose --profile swarm up -d
# ==============================================================

networks:
  defesa-net:
    driver: bridge
    attachable: true

volumes:
  db_data:
    driver: local

services:

  # ============================================================
  # 1. BANCO DE DADOS - PostgreSQL 15
  # ============================================================
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: defesacivil
      POSTGRES_USER: defesa_user
      POSTGRES_PASSWORD: defesa_password
    volumes:
      - db_data:/var/lib/postgresql/data
    networks:
      - defesa-net
    restart: on-failure
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U defesa_user -d defesacivil"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
      placement:
        constraints:
          - node.role == manager
      resources:
        limits:
          memory: 512M
          cpus: '0.5'
        reservations:
          memory: 128M

  # ============================================================
  # 2. OBJECT STORAGE - MinIO
  # ============================================================
  # MinIO roda nativamente no Mac mini (fotos.rhprogramer.com.br).
  # O backend acessa via host.docker.internal:9000.
  # Para o seminario (Swarm local), suba antes do deploy:
  #   docker run -d --name minio -p 9000:9000 -p 9001:9001
  #     -e MINIO_ROOT_USER=minioadmin -e MINIO_ROOT_PASSWORD=minioadmin
  #     bitnami/minio:latest

  # ============================================================
  # 3. BACKEND - Spring Boot API REST
  # ============================================================
  # Sem ports: o nginx-lb expoe a porta 8080 publicamente.
  # Multiplas replicas sem conflito de porta de host.
  backend:
    image: defesacivil-backend:latest
    build:
      context: ./defesa-backend
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: jdbc:postgresql://db:5432/defesacivil
      DATABASE_USERNAME: defesa_user
      DATABASE_PASSWORD: defesa_password
      APP_JWT_SECRET: ${APP_JWT_SECRET:-super_secret_jwt_token_for_defesa_civil_app_2026}
      MANAGEMENT_HEALTH_MAIL_ENABLED: "false"
      MINIO_ENDPOINT: ${MINIO_ENDPOINT:-http://host.docker.internal:9000}
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-minioadmin}
      MINIO_BUCKET: ${MINIO_BUCKET:-defesa-civil}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
    networks:
      - defesa-net
    restart: on-failure
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8080/actuator/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 90s
    deploy:
      replicas: 3
      restart_policy:
        condition: on-failure
        delay: 10s
        max_attempts: 5
      update_config:
        parallelism: 1
        delay: 15s
        failure_action: rollback
        order: start-first
      rollback_config:
        parallelism: 1
        delay: 10s
      placement:
        constraints:
          - node.role == worker
      resources:
        limits:
          memory: 768M
          cpus: '1.0'
        reservations:
          memory: 256M

  # ============================================================
  # 4. FRONTEND - Flutter Web (servido pelo Nginx)
  # ============================================================
  # Sem ports: o nginx-lb expoe a porta 80 publicamente.
  # Multiplas replicas sem conflito de porta de host.
  frontend:
    image: defesacivil-frontend:latest
    build:
      context: .
      dockerfile: Dockerfile.flutter
    networks:
      - defesa-net
    restart: on-failure
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:80/ || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
    deploy:
      replicas: 2
      restart_policy:
        condition: on-failure
        delay: 5s
      update_config:
        parallelism: 1
        delay: 10s
        failure_action: rollback
        order: start-first
      placement:
        constraints:
          - node.role == worker
      resources:
        limits:
          memory: 128M
          cpus: '0.25'
        reservations:
          memory: 32M

  # ============================================================
  # 5. LOAD BALANCER - Nginx (unica porta publica do sistema)
  # ============================================================
  # porta 80   -> frontend (Flutter Web)
  # porta 8080 -> backend API (Spring Boot)
  nginx-lb:
    image: nginx:1.25-alpine
    ports:
      - "80:80"
      - "8080:8080"
    volumes:
      - ./nginx/nginx-lb.conf:/etc/nginx/nginx.conf:ro
    networks:
      - defesa-net
    restart: on-failure
    depends_on:
      - frontend
      - backend
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:80/nginx-health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure
      placement:
        constraints:
          - node.role == manager
      resources:
        limits:
          memory: 64M
          cpus: '0.25'

  # ============================================================
  # 6. DOCKER VISUALIZER - Painel grafico do cluster Swarm
  # ============================================================
  # Referencia: "Descomplicando o Docker" - Jeferson Fernando
  # Acesse: http://localhost:8081
  #
  # APENAS para o seminario (profile "swarm"). Nao sobe no
  # docker-compose up padrao (producao Mac mini).
  #
  # Para subir: docker-compose --profile swarm up -d
  visualizer:
    image: dockersamples/visualizer:stable
    profiles: ["swarm"]
    ports:
      - "8081:8080"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - defesa-net
    restart: on-failure
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure
      placement:
        constraints:
          - node.role == manager
      resources:
        limits:
          memory: 128M
          cpus: '0.25'