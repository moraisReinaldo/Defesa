# ==============================================================
# docker-compose.yml â€” Defesa em Foco Â· Stack Principal
# ==============================================================
# Infraestrutura como CÃ³digo (IaC).
# CompatÃ­vel com docker-compose up E docker stack deploy (Swarm).
#
# ServiÃ§os:
#   db          â†’ PostgreSQL 15           (1 rÃ©plica, manager)
#   minio       â†’ MinIO (object storage)  (1 rÃ©plica, manager)
#   backend     â†’ Spring Boot API         (3 rÃ©plicas, workers)
#   frontend    â†’ Flutter Web + Nginx     (2 rÃ©plicas, workers)
#   nginx-lb    â†’ Nginx Load Balancer     (1 rÃ©plica, manager)
#   visualizer  â†’ Docker Visualizer       (1 rÃ©plica, manager)
#
# Build das imagens (antes do deploy):
#   docker build -t defesacivil-backend:latest ./defesa-backend
#   docker build -t defesacivil-frontend:latest .
#
# Uso local (Mac mini / dev):
#   docker-compose up -d
#
# Deploy no Swarm (seminÃ¡rio):
#   docker stack deploy -c docker-compose.yml defesacivil
#
# Escalar rÃ©plicas em tempo real:
#   docker service scale defesacivil_backend=5
#   docker service scale defesacivil_frontend=4
# ==============================================================

networks:
  defesa-net:
    # bridge: funciona em docker-compose up e docker stack deploy
    driver: bridge
    attachable: true

volumes:
  db_data:
    driver: local
  minio_data:
    driver: local

services:

  # ============================================================
  # 1. BANCO DE DADOS â€” PostgreSQL 15
  # ============================================================
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: defesacivil
      POSTGRES_USER: defesa_user
      POSTGRES_PASSWORD: defesa_password
    volumes:
      - db_data:/var/lib/postgresql/data
    networks:
      - defesa-net
    restart: on-failure
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U defesa_user -d defesacivil"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
      placement:
        constraints:
          - node.role == manager
      resources:
        limits:
          memory: 512M
          cpus: '0.5'
        reservations:
          memory: 128M

  # ============================================================
  # 2. OBJECT STORAGE â€” MinIO
  # ============================================================
  minio:
    image: quay.io/minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-minioadmin}
    volumes:
      - minio_data:/data
    ports:
      - "9000:9000"   # API S3
      - "9001:9001"   # Console Web (http://localhost:9001)
    networks:
      - defesa-net
    restart: on-failure
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure
      placement:
        constraints:
          - node.role == manager
      resources:
        limits:
          memory: 512M
          cpus: '0.5'
        reservations:
          memory: 128M

  # ============================================================
  # 3. BACKEND â€” Spring Boot API REST
  # ============================================================
  # Sem ports: o nginx-lb expÃµe a porta 8080 publicamente.
  # MÃºltiplas rÃ©plicas sem conflito de porta de host.
  backend:
    image: defesacivil-backend:latest
    environment:
      DATABASE_URL: jdbc:postgresql://db:5432/defesacivil
      DATABASE_USERNAME: defesa_user
      DATABASE_PASSWORD: defesa_password
      APP_JWT_SECRET: ${APP_JWT_SECRET:-super_secret_jwt_token_for_defesa_civil_app_2026}
      MANAGEMENT_HEALTH_MAIL_ENABLED: "false"
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-minioadmin}
      MINIO_BUCKET: ${MINIO_BUCKET:-defesa-civil}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
    networks:
      - defesa-net
    restart: on-failure
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8080/actuator/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 90s
    deploy:
      replicas: 3
      restart_policy:
        condition: on-failure
        delay: 10s
        max_attempts: 5
      update_config:
        parallelism: 1
        delay: 15s
        failure_action: rollback
        order: start-first
      rollback_config:
        parallelism: 1
        delay: 10s
      placement:
        constraints:
          - node.role == worker
      resources:
        limits:
          memory: 768M
          cpus: '1.0'
        reservations:
          memory: 256M

  # ============================================================
  # 4. FRONTEND â€” Flutter Web (servido pelo Nginx)
  # ============================================================
  # Sem ports: o nginx-lb expÃµe a porta 80 publicamente.
  # MÃºltiplas rÃ©plicas sem conflito de porta de host.
  frontend:
    image: defesacivil-frontend:latest
    networks:
      - defesa-net
    restart: on-failure
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:80/ || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
    deploy:
      replicas: 2
      restart_policy:
        condition: on-failure
        delay: 5s
      update_config:
        parallelism: 1
        delay: 10s
        failure_action: rollback
        order: start-first
      placement:
        constraints:
          - node.role == worker
      resources:
        limits:
          memory: 128M
          cpus: '0.25'
        reservations:
          memory: 32M

  # ============================================================
  # 5. LOAD BALANCER â€” Nginx (Ãºnica porta pÃºblica do sistema)
  # ============================================================
  # porta 80   â†’ roteia para os containers frontend
  # porta 8080 â†’ roteia para os containers backend
  nginx-lb:
    image: nginx:1.25-alpine
    ports:
      - "80:80"      # Frontend pÃºblico
      - "8080:8080"  # Backend API pÃºblica
    volumes:
      - ./nginx/nginx-lb.conf:/etc/nginx/nginx.conf:ro
    networks:
      - defesa-net
    restart: on-failure
    depends_on:
      - frontend
      - backend
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:80/nginx-health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure
      placement:
        constraints:
          - node.role == manager
      resources:
        limits:
          memory: 64M
          cpus: '0.25'

  # ============================================================
  # 6. DOCKER VISUALIZER â€” Painel grÃ¡fico do cluster Swarm
  # ============================================================
  # ReferÃªncia: "Descomplicando o Docker" â€” Jeferson Fernando
  # Acesse: http://localhost:8081
  visualizer:
    image: dockersamples/visualizer:stable
    ports:
      - "8081:8080"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - defesa-net
    restart: on-failure
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure
      placement:
        constraints:
          - node.role == manager
      resources:
        limits:
          memory: 128M
          cpus: '0.25'

