version: '3.8'

services:
  # ==========================================
  # Banco de Dados
  # ==========================================
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: defesacivil
      POSTGRES_USER: defesa_user
      POSTGRES_PASSWORD: defesa_password
    volumes:
      - db_data:/var/lib/postgresql/data
    networks:
      - swarm-net
    deploy:
      # O banco de dados normalmente tem 1 réplica e fica no manager (ou node com volume persistente)
      replicas: 1
      placement:
        constraints:
          - node.role == manager

  # ==========================================
  # Backend (Spring Boot)
  # ==========================================
  backend:
    image: defesacivil-backend:latest
    # IMPORTANTE: Em um Swarm real, a imagem deve estar em um registry acessível por todos os nós
    build:
      context: ./defesa-backend
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: jdbc:postgresql://db:5432/defesacivil
      DATABASE_USERNAME: defesa_user
      DATABASE_PASSWORD: defesa_password
      APP_JWT_SECRET: super_secret_jwt_token_for_defesa_civil_app_2026
      MANAGEMENT_HEALTH_MAIL_ENABLED: "false"
      MINIO_ENDPOINT: http://host.docker.internal:9000
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-minioadmin}
      MINIO_BUCKET: defesa-civil
    ports:
      - target: 8080
        published: 8080
        protocol: tcp
        mode: host
    networks:
      - swarm-net
    depends_on:
      - db
    deploy:
      # Mac Mini 2014: 1 réplica (Spring Boot demora ~80s pra subir e consome ~500MB RAM)
      replicas: 1
      update_config:
        parallelism: 1
        delay: 10s
        monitor: 120s
        failure_action: continue
      restart_policy:
        condition: on-failure
        delay: 30s

  # ==========================================
  # Frontend (Flutter Web)
  # ==========================================
  frontend:
    image: defesacivil-frontend:latest
    build:
      context: .
      dockerfile: Dockerfile.flutter
    ports:
      - target: 80
        published: 3000
        protocol: tcp
        mode: host
    networks:
      - swarm-net
    deploy:
      # Mac Mini 2014: 1 réplica para economizar recursos
      replicas: 1
      update_config:
        parallelism: 1
        delay: 10s
      restart_policy:
        condition: on-failure

  # ==========================================
  # Docker Visualizer
  # ==========================================
  # Representação gráfica do cluster Swarm (livro "Descomplicando o Docker")
  visualizer:
    image: dockersamples/visualizer:stable
    ports:
      - target: 8080
        published: 8081
        protocol: tcp
        mode: host
    volumes:
      - "/var/run/docker.sock:/var/run/docker.sock"
    networks:
      - swarm-net
    deploy:
      replicas: 1
      placement:
        # Visualizer PRECISA rodar no node manager para acessar as informações do cluster
        constraints:
          - node.role == manager

networks:
  swarm-net:
    driver: overlay

volumes:
  db_data:
