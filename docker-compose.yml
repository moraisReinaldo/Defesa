# ==============================================================
# docker-compose.yml - Defesa em Foco / Stack Principal
# ==============================================================
# Compativel com docker-compose up E docker stack deploy (Swarm).
#
# Uso local (Mac mini / producao):
#   docker-compose up -d --build
#
# Deploy no Swarm (seminario):
#   docker stack deploy -c docker-compose.yml defesacivil
#
# Visualizer (apenas seminario):
#   docker-compose --profile swarm up -d
# ==============================================================

networks:
  defesa-net:
    driver: overlay
    attachable: true

volumes:
  db_data:
    driver: local

services:

  # ============================================================
  # 1. BANCO DE DADOS PRINCIPAL - PostgreSQL 15 Customizado (Manager)
  # ============================================================
  db:
    image: defesacivil-db:latest
    build:
      context: ./docker/postgres
      dockerfile: Dockerfile
    environment:
      POSTGRES_DB: defesacivil
      POSTGRES_USER: defesa_user
      POSTGRES_PASSWORD: defesa_password
    volumes:
      - db_data:/var/lib/postgresql/data
    networks:
      - defesa-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U defesa_user -d defesacivil"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    deploy:
      replicas: 1
      restart_policy:
        condition: any
        delay: 5s
      placement:
        constraints:
          - node.role == manager
      resources:
        limits:
          memory: 384M
          cpus: '0.5'
        reservations:
          memory: 128M

  # ============================================================
  # 1.1 BANCO DE DADOS - Réplica 1 (swarm-worker1)
  # ============================================================
  db-replica1:
    image: defesacivil-db:latest
    environment:
      POSTGRES_DB: defesacivil
      POSTGRES_USER: defesa_user
      POSTGRES_PASSWORD: defesa_password
    networks:
      - defesa-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U defesa_user -d defesacivil"]
      interval: 15s
      timeout: 5s
      retries: 3
    deploy:
      replicas: 1
      restart_policy:
        condition: any
      placement:
        constraints:
          - node.hostname == swarm-worker1
      resources:
        limits:
          memory: 256M
          cpus: '0.25'

  # ============================================================
  # 1.2 BANCO DE DADOS - Réplica 2 (swarm-worker2)
  # ============================================================
  db-replica2:
    image: defesacivil-db:latest
    environment:
      POSTGRES_DB: defesacivil
      POSTGRES_USER: defesa_user
      POSTGRES_PASSWORD: defesa_password
    networks:
      - defesa-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U defesa_user -d defesacivil"]
      interval: 15s
      timeout: 5s
      retries: 3
    deploy:
      replicas: 1
      restart_policy:
        condition: any
      placement:
        constraints:
          - node.hostname == swarm-worker2
      resources:
        limits:
          memory: 256M
          cpus: '0.25'

  # ============================================================
  # 2. OBJECT STORAGE - MinIO
  # ============================================================
  # MinIO roda no Mac mini (fotos.rhprogramer.com.br :9000/:9001).

  # ============================================================
  # 3. BACKEND - Spring Boot API REST (Multi-réplicas)
  # ============================================================
  backend:
    image: defesacivil-backend:latest
    build:
      context: ./defesa-backend
      dockerfile: Dockerfile
    env_file:
      - ./defesa-backend/.env
    environment:
      DATABASE_URL: jdbc:postgresql://db:5432/defesacivil
      DATABASE_USERNAME: defesa_user
      DATABASE_PASSWORD: defesa_password
      MANAGEMENT_HEALTH_MAIL_ENABLED: "false"
      JAVA_TOOL_OPTIONS: "-Xmx256m -Xms128m"
    networks:
      - defesa-net
    restart: unless-stopped
    depends_on:
      - db
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8080/actuator/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 90s
    deploy:
      replicas: 3
      restart_policy:
        condition: any
        delay: 10s
      update_config:
        parallelism: 1
        delay: 15s
        failure_action: rollback
        order: start-first
      rollback_config:
        parallelism: 1
        delay: 10s
      placement:
        preferences:
          - spread: node.id
      resources:
        limits:
          memory: 384M
          cpus: '0.75'
        reservations:
          memory: 128M

  # ============================================================
  # 4. FRONTEND - Flutter Web + Nginx (Multi-réplicas)
  # ============================================================
  # ============================================================
  # 4. FRONTEND - Flutter Web + Nginx (2 Réplicas: Manager e Worker 1)
  # ============================================================
  frontend:
    image: defesacivil-frontend:latest
    build:
      context: .
      dockerfile: Dockerfile.flutter
    networks:
      - defesa-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:80/ || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
    deploy:
      replicas: 2
      restart_policy:
        condition: any
        delay: 5s
      update_config:
        parallelism: 1
        delay: 10s
        failure_action: rollback
        order: start-first
      placement:
        constraints:
          - node.hostname != swarm-worker2
      resources:
        limits:
          memory: 128M
          cpus: '0.25'
        reservations:
          memory: 32M

  # ============================================================
  # 4.1 ADMINER - DB Explorer Web (Worker 2 no lugar do Frontend)
  # ============================================================
  adminer:
    image: adminer:4-standalone
    ports:
      - target: 8080
        published: 8082
        protocol: tcp
        mode: host
    networks:
      - defesa-net
    restart: unless-stopped
    deploy:
      replicas: 1
      restart_policy:
        condition: any
      placement:
        constraints:
          - node.hostname == swarm-worker2
      resources:
        limits:
          memory: 96M
          cpus: '0.2'

  # ============================================================
  # 5. LOAD BALANCER - Nginx (porta 8000 Web / 8080 API)
  # ============================================================
  nginx-lb:
    image: nginx:1.25-alpine
    ports:
      - target: 80
        published: 8000
        protocol: tcp
        mode: host
      - target: 8080
        published: 8080
        protocol: tcp
        mode: host
    volumes:
      - ./nginx/nginx-lb.conf:/etc/nginx/nginx.conf:ro
    networks:
      - defesa-net
    restart: unless-stopped
    depends_on:
      - frontend
      - backend
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:80/nginx-health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
    deploy:
      replicas: 1
      restart_policy:
        condition: any
      placement:
        constraints:
          - node.role == manager
      resources:
        limits:
          memory: 64M
          cpus: '0.25'

  # ============================================================
  # 6. DOCKER VISUALIZER - Painel gráfico do cluster Swarm
  # ============================================================
  # Referência: "Descomplicando o Docker" - Jeferson Fernando
  # Acesse: http://localhost:8081
  visualizer:
    image: dockersamples/visualizer:stable
    ports:
      - target: 8080
        published: 8081
        protocol: tcp
        mode: host
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - defesa-net
    restart: unless-stopped
    deploy:
      replicas: 1
      restart_policy:
        condition: any
      placement:
        constraints:
          - node.role == manager
      resources:
        limits:
          memory: 128M
          cpus: '0.25'