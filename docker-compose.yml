version: '3.8'

services:
  # ==========================================
  # Banco de Dados
  # ==========================================
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: defesacivil
      POSTGRES_USER: defesa_user
      POSTGRES_PASSWORD: defesa_password
    volumes:
      - db_data:/var/lib/postgresql/data
    restart: on-failure

  # ==========================================
  # Backend (Spring Boot)
  # ==========================================
  backend:
    image: defesacivil-backend:latest
    build:
      context: ./defesa-backend
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: jdbc:postgresql://db:5432/defesacivil
      DATABASE_USERNAME: defesa_user
      DATABASE_PASSWORD: defesa_password
      APP_JWT_SECRET: super_secret_jwt_token_for_defesa_civil_app_2026
      MANAGEMENT_HEALTH_MAIL_ENABLED: "false"
      MINIO_ENDPOINT: http://host.docker.internal:9000
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-minioadmin}
      MINIO_BUCKET: defesa-civil
    ports:
      - "8080:8080"
    depends_on:
      - db
    restart: on-failure

  # ==========================================
  # Frontend (Flutter Web)
  # ==========================================
  frontend:
    image: defesacivil-frontend:latest
    build:
      context: .
      dockerfile: Dockerfile.flutter
    ports:
      - "3000:80"
    restart: on-failure

  # ==========================================
  # Docker Visualizer
  # ==========================================
  visualizer:
    image: dockersamples/visualizer:stable
    ports:
      - "8081:8080"
    volumes:
      - "/var/run/docker.sock:/var/run/docker.sock"

volumes:
  db_data:
