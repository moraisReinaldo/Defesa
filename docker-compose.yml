version: '3.8'

services:
  # ==========================================
  # Banco de Dados
  # ==========================================
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: defesacivil
      POSTGRES_USER: defesa_user
      POSTGRES_PASSWORD: defesa_password
    volumes:
      - db_data:/var/lib/postgresql/data
    networks:
      - swarm-net
    deploy:
      # O banco de dados normalmente tem 1 réplica e fica no manager (ou node com volume persistente)
      replicas: 1
      placement:
        constraints:
          - node.role == manager

  # ==========================================
  # Backend (Spring Boot)
  # ==========================================
  backend:
    image: defesacivil-backend:latest
    # IMPORTANTE: Em um Swarm real, a imagem deve estar em um registry acessível por todos os nós
    build:
      context: ./defesa-backend
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: jdbc:postgresql://db:5432/defesacivil
      DATABASE_USERNAME: defesa_user
      DATABASE_PASSWORD: defesa_password
      APP_JWT_SECRET: super_secret_jwt_token_for_defesa_civil_app_2026
    ports:
      - "8080:8080"
    networks:
      - swarm-net
    depends_on:
      - db
    deploy:
      # Variação de réplicas: 3 instâncias para alta disponibilidade
      replicas: 3
      update_config:
        parallelism: 1
        delay: 10s
      restart_policy:
        condition: on-failure

  # ==========================================
  # Frontend (Vite + React + Express)
  # ==========================================
  frontend:
    image: defesacivil-frontend:latest
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      - PORT=3000
    ports:
      - "3000:3000"
    networks:
      - swarm-net
    deploy:
      # Variação de réplicas: 2 instâncias do frontend
      replicas: 2
      update_config:
        parallelism: 1
        delay: 10s
      restart_policy:
        condition: on-failure

  # ==========================================
  # Docker Visualizer
  # ==========================================
  # Representação gráfica do cluster Swarm (livro "Descomplicando o Docker")
  visualizer:
    image: dockersamples/visualizer:stable
    ports:
      - "8081:8080"
    volumes:
      - "/var/run/docker.sock:/var/run/docker.sock"
    networks:
      - swarm-net
    deploy:
      replicas: 1
      placement:
        # Visualizer PRECISA rodar no node manager para acessar as informações do cluster
        constraints:
          - node.role == manager

networks:
  swarm-net:
    driver: overlay

volumes:
  db_data:
