server.port=8080

# PostgreSQL Configuration
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/defesacivil_db}
spring.datasource.username=${DATABASE_USERNAME:defesacivil}
spring.datasource.password=${DATABASE_PASSWORD:defesa@2025}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# MinIO Configuration
minio.endpoint=${MINIO_ENDPOINT:https://fotos.rhprogramer.com.br}
minio.access-key=${MINIO_ACCESS_KEY:admin}
minio.secret-key=${MINIO_SECRET_KEY:defesa@2025}
minio.bucket-name=${MINIO_BUCKET:defesa-civil}

# Admin password — OBRIGATÓRIO configurar via variável de ambiente em produção
# export APP_ADMIN_PASSWORD=SuaSenhaSeguraAqui
app.admin.password=${APP_ADMIN_PASSWORD:$2a$10$/YYWmmZXz/JqywyzZNXpw.OTTPu2bZ000Rx6i60dUpiTsGhRYt5LK}

# Super Admin (Dono da Plataforma) — visibilidade total, sem restrição de cidade
# Email fixo do proprietário do sistema
app.super-admin.email=reinaldohm07@gmail.com
app.super-admin.nome=Reinaldo Morais
# OBRIGATÓRIO em produção: export APP_SUPER_ADMIN_SENHA=SuaSenhaSegura
app.super-admin.senha=${APP_SUPER_ADMIN_SENHA:}

# Mail Configuration — usar variáveis de ambiente em produção
# export MAIL_USERNAME=seu_email@gmail.com
# export MAIL_PASSWORD=sua_senha_de_app
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:defesaemfoco07@gmail.com}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true

# Email de destino para notificações de admin
app.admin.notification.email=${APP_ADMIN_NOTIFICATION_EMAIL:defesaemfoco07@gmail.com}

# CORS — restringir em produção
# Em produção, substituir por: https://api.defesaemfoco.com.br
spring.web.cors.allowed-origin-patterns=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:8080,http://localhost:5173,https://localhost:3000,https://localhost:8080,https://localhost:5173,http://127.0.0.1:3000,http://127.0.0.1:8080,http://127.0.0.1:5173,https://defesa.rhprogramer.com.br}
# JWT Secret - OBRIGATÓRIO 32+ caracteres em produção
# export APP_JWT_SECRET=SuaChaveSuperSecretaComMaisDe32Caracteres
app.jwt.secret=${APP_JWT_SECRET:DefesaCivilEmFocoChaveSecretaJWT2025SuperSegura}

# OneSignal Push Notification
onesignal.app.id=${ONESIGNAL_APP_ID:6537856b-c264-42af-b2a9-583652a175d2}
onesignal.rest.key=${ONESIGNAL_REST_KEY:}

# Actuator — Expor APENAS o health check (segurança)
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never

# Performance - Compressão Gzip
server.compression.enabled=true
server.compression.mime-types=application/json,application/xml,text/html,text/xml,text/plain
server.compression.min-response-size=1024

# Security - Headers básicos
server.server-header=DefesaCivil-API
server.error.include-stacktrace=never
server.error.include-message=always
server.error.include-binding-errors=always

# Stripe Configuration
# export STRIPE_SECRET_KEY=sk_live_... (ou sk_test_...)
# export STRIPE_WEBHOOK_SECRET=whsec_...
stripe.secret-key=${STRIPE_SECRET_KEY:}
stripe.webhook-secret=${STRIPE_WEBHOOK_SECRET:}

