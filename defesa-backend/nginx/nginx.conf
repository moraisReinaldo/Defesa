# ==============================================================
# nginx.conf — Reverse Proxy / Load Balancer
# ==============================================================
# Distribui tráfego entre backend1 e backend2 com failover.
# ==============================================================

worker_processes auto;
error_log /var/log/nginx/error.log warn;

events {
    worker_connections 1024;
    multi_accept on;
}

http {
    # ── Upstream (Load Balancer) ──────────────────────────────
    upstream backend_servers {
        least_conn;
        server backend1:8080 max_fails=3 fail_timeout=30s;
        server backend2:8080 max_fails=3 fail_timeout=30s;
        keepalive 16;
    }

    # ── Logging ───────────────────────────────────────────────
    log_format main '$remote_addr - $remote_user [$time_local] '
                    '"$request" $status $body_bytes_sent '
                    '"$http_referer" "$http_user_agent" '
                    'rt=$request_time';
    access_log /var/log/nginx/access.log main;

    # ── Performance ───────────────────────────────────────────
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;

    # Gzip (APIs JSON)
    gzip on;
    gzip_vary on;
    gzip_min_length 256;
    gzip_types application/json application/xml text/plain text/css;

    # ── Limites ───────────────────────────────────────────────
    client_max_body_size 20m;
    client_body_timeout 30s;
    client_header_timeout 15s;

    # ── Server ────────────────────────────────────────────────
    server {
        listen 80;
        server_name _;

        # Esconder versão do Nginx
        server_tokens off;

        # ── Security Headers ─────────────────────────────────
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;

        # ── Proxy para os backends ───────────────────────────
        location / {
            proxy_pass http://backend_servers;

            # Headers para o backend saber o IP real do cliente
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Connection "";

            # HTTP/1.1 para keepalive com upstream
            proxy_http_version 1.1;

            # Timeouts
            proxy_connect_timeout 10s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;

            # Buffers otimizados para JSON APIs
            proxy_buffering on;
            proxy_buffer_size 8k;
            proxy_buffers 8 16k;

            # Failover: se um backend falhar, tenta o outro
            proxy_next_upstream error timeout http_502 http_503 http_504;
            proxy_next_upstream_tries 2;
            proxy_next_upstream_timeout 10s;
        }

        # ── Health check do próprio Nginx ─────────────────────
        location /nginx-health {
            access_log off;
            return 200 'OK';
            add_header Content-Type text/plain;
        }
    }
}
