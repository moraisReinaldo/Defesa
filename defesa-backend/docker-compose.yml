version: '3.8'

services:
  backend1:
    build: .
    environment:
      - DATABASE_URL=jdbc:postgresql://host.docker.internal:5432/defesacivil_db
      - DATABASE_USERNAME=${DATABASE_USERNAME:-defesacivil}
      - DATABASE_PASSWORD=${DATABASE_PASSWORD:-defesa@2025}
      - MINIO_ENDPOINT=${MINIO_ENDPOINT:-https://seeker-with-interviews-findarticles.trycloudflare.com}
      - MINIO_ACCESS_KEY=${MINIO_ACCESS_KEY:-admin}
      - MINIO_SECRET_KEY=${MINIO_SECRET_KEY:-defesa@2025}
    extra_hosts:
      - "host.docker.internal:host-gateway"

  backend2:
    build: .
    environment:
      - DATABASE_URL=jdbc:postgresql://host.docker.internal:5432/defesacivil_db
      - DATABASE_USERNAME=${DATABASE_USERNAME:-defesacivil}
      - DATABASE_PASSWORD=${DATABASE_PASSWORD:-defesa@2025}
      - MINIO_ENDPOINT=${MINIO_ENDPOINT:-https://seeker-with-interviews-findarticles.trycloudflare.com}
      - MINIO_ACCESS_KEY=${MINIO_ACCESS_KEY:-admin}
      - MINIO_SECRET_KEY=${MINIO_SECRET_KEY:-defesa@2025}
    extra_hosts:
      - "host.docker.internal:host-gateway"

  nginx:
    image: nginx:latest
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "80:80"
    depends_on:
      - backend1
      - backend2
